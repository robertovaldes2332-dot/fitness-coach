<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f4f0"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Mi Coach Fitness</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><link rel="stylesheet" href="modern.css">
</head><body>
<header class="top"><div class="topin"><button class="brand" onclick="go('explore')">Mi Coach <span>Fitness</span></button><div class="context">Entrena lo que quieras, cuando quieras.</div></div></header>
<main class="shell" id="app"></main>
<div class="builder hidden" id="builder"><div><strong id="builderCount">0 ejercicios</strong><br><span>Tu sesión de hoy</span></div><button class="btn small" onclick="startDraft()">Empezar</button></div>
<nav class="bottom"><div class="bottomin"><button class="navbtn on" data-page="explore" onclick="go('explore')"><i></i>Explorar</button><button class="navbtn" data-page="session" onclick="go('session')"><i></i>Sesión</button><button class="navbtn" data-page="history" onclick="go('history')"><i></i>Historial</button><button class="navbtn" data-page="equipment" onclick="go('equipment')"><i></i>Equipo</button></div></nav>
<dialog id="detail"><div class="modal-head"><b>Guía del ejercicio</b><button class="close" onclick="detail.close()" aria-label="Cerrar">×</button></div><div id="detailContent"></div></dialog>
<div class="workout hidden" id="workout"></div><div class="toast" id="toast"></div><script src="modern.js"></script>
</body></html>
